name: Android APK 자동 빌드

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java 17 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 준비
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android SDK 34 설치
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 앱 프로젝트 생성
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/longphotocropper/app

          cat > settings.gradle <<'EOF'
      - name: APK 빌드
        run: gradle --no-daemon :app:assembleDebug

      - name: APK 파일 이름 변경
        run: cp app/build/outputs/apk/debug/app-debug.apk long-photo-cropper-v0.5-test.apk

      - name: APK 다운로드 파일 만들기
        uses: actions/upload-artifact@v4
        with:
          name: long-photo-cropper-v0.5-test
          path: long-photo-cropper-v0.5-test.apk
