<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>긴사진 자르기</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f4f6;
  color: #111827;
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  background: white;
}

header {
  padding: 14px 16px 12px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
}

h1 {
  margin: 0;
  font-size: 20px;
}

.sub {
  margin-top: 4px;
  font-size: 12px;
  color: #6b7280;
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 14px 16px 10px;
}

button,
.fileLabel {
  min-height: 48px;
  border: 0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.fileLabel {
  background: #111827;
  color: white;
}

#saveBtn {
  background: #ef4444;
  color: white;
  transition: background .2s ease;
}

#saveBtn.saved {
  background: #16a34a;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

input[type=file] {
  display: none;
}

.info {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 0 16px 10px;
  font-size: 13px;
  color: #4b5563;
}

.hint {
  margin: 0 16px 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #fff7ed;
  color: #9a3412;
  font-size: 13px;
  line-height: 1.45;
}

/* 저장 완료 메시지 */
.message {
  display: none;
  position: fixed;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 9999;

  width: calc(100% - 32px);
  max-width: 420px;

  padding: 14px 18px;

  border-radius: 14px;

  background: #111827;
  color: white;

  text-align: center;
  font-size: 16px;
  font-weight: 800;

  box-shadow: 0 8px 30px rgba(0,0,0,.25);
}

.viewport {
  height: calc(100vh - 195px);
  min-height: 420px;
  overflow: auto;
  background: #d1d5db;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.stage {
  position: relative;
  width: 100%;
  min-height: 100%;
  background: white;
}

#preview {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
  object-position: top left;
  user-select: none;
  -webkit-user-drag: none;
}

.empty {
  min-height: 420px;
  display: grid;
  place-items: center;
  padding: 25px;
  text-align: center;
  color: #6b7280;
  line-height: 1.6;
}

[hidden] {
  display: none !important;
}

.cropLine {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 3px solid #ef4444;
  z-index: 10;
  cursor: ns-resize;
  touch-action: none;
}

.cropLine::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -20px;
  height: 40px;
}

.badge {
  position: absolute;
  right: 8px;
  top: -34px;
  padding: 5px 8px;
  border-radius: 8px;
  background: #ef4444;
  color: white;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.privacy {
  padding: 12px 16px 18px;
  color: #6b7280;
  font-size: 12px;
  line-height: 1.5;
}
</style>
</head>

<body>

<main class="app">

<header>
  <h1>긴사진 자르기</h1>

  <div class="sub">
    사진은 서버로 전송되지 않고 이 기기 안에서만 처리됩니다.
  </div>
</header>

<section class="toolbar">

  <label class="fileLabel" for="fileInput">
    사진 불러오기
  </label>

  <button id="saveBtn" disabled>
    저장하기
  </button>

  <input
    id="fileInput"
    type="file"
    accept="image/*"
  >

</section>

<section class="info">
  <span id="sizeInfo">사진을 선택해 주세요</span>
  <strong id="cutInfo">끝점 416px</strong>
</section>

<div class="hint">
  빨간 선을 위아래로 움직여 자를 위치를 맞춘 뒤 저장하세요.
  처음 위치는 원본 기준 416px입니다.
</div>

<div class="message" id="message">
  ✓ 저장되었습니다
</div>

<section class="viewport" id="viewport">

  <div class="stage">

    <div class="empty" id="empty">
      긴 스크린샷이나 사진을 선택하면 여기에 표시됩니다.
    </div>

    <img id="preview" alt="" hidden>

    <div class="cropLine" id="cropLine" hidden>
      <span class="badge" id="lineBadge">416px</span>
    </div>

  </div>

</section>

<div class="privacy">
  선택한 사진과 자른 이미지는 별도 서버에 저장되지 않습니다.
</div>

</main>

<script>
(() => {

  "use strict";

  const DEFAULT_CUT = 416;

  const fileInput =
    document.getElementById("fileInput");

  const saveBtn =
    document.getElementById("saveBtn");

  const preview =
    document.getElementById("preview");

  const cropLine =
    document.getElementById("cropLine");

  const lineBadge =
    document.getElementById("lineBadge");

  const sizeInfo =
    document.getElementById("sizeInfo");

  const cutInfo =
    document.getElementById("cutInfo");

  const viewport =
    document.getElementById("viewport");

  const empty =
    document.getElementById("empty");

  const message =
    document.getElementById("message");


  let objectUrl = null;
  let originalWidth = 0;
  let originalHeight = 0;
  let selectedY = DEFAULT_CUT;
  let dragging = false;

  let messageTimer = null;
  let buttonTimer = null;


  function showSaveSuccess() {

    clearTimeout(messageTimer);
    clearTimeout(buttonTimer);

    /* 화면 아래 저장 완료 메시지 */
    message.style.display = "block";

    messageTimer = setTimeout(() => {
      message.style.display = "none";
    }, 2200);


    /* 저장 버튼도 잠시 변경 */
    saveBtn.textContent = "저장 완료 ✓";
    saveBtn.classList.add("saved");

    buttonTimer = setTimeout(() => {
      saveBtn.textContent = "저장하기";
      saveBtn.classList.remove("saved");
    }, 2200);
  }


  function scale() {

    if (!originalWidth) {
      return 1;
    }

    return preview.clientWidth / originalWidth;
  }


  function clampY(y) {

    if (!originalHeight) {
      return DEFAULT_CUT;
    }

    return Math.max(
      1,
      Math.min(
        originalHeight,
        Math.round(y)
      )
    );
  }


  function updateLine() {

    if (!originalHeight || preview.hidden) {
      return;
    }

    selectedY = clampY(selectedY);

    cropLine.style.top =
      (selectedY * scale()) + "px";

    lineBadge.textContent =
      selectedY.toLocaleString() + "px";

    cutInfo.textContent =
      "끝점 " +
      selectedY.toLocaleString() +
      "px";
  }


  function moveLine(clientY) {

    const rect =
      preview.getBoundingClientRect();

    const currentScale =
      scale();

    if (!currentScale) {
      return;
    }

    const y =
      (clientY - rect.top) /
      currentScale;

    selectedY =
      clampY(y);

    updateLine();
  }


  cropLine.addEventListener(
    "pointerdown",
    event => {

      dragging = true;

      try {
        cropLine.setPointerCapture(
          event.pointerId
        );
      } catch (_) {}

      event.preventDefault();
    }
  );


  cropLine.addEventListener(
    "pointermove",
    event => {

      if (!dragging) {
        return;
      }

      moveLine(
        event.clientY
      );

      event.preventDefault();
    }
  );


  cropLine.addEventListener(
    "pointerup",
    event => {

      dragging = false;

      try {
        cropLine.releasePointerCapture(
          event.pointerId
        );
      } catch (_) {}
    }
  );


  cropLine.addEventListener(
    "pointercancel",
    () => {
      dragging = false;
    }
  );


  fileInput.addEventListener(
    "change",
    () => {

      const file =
        fileInput.files &&
        fileInput.files[0];

      if (!file) {
        return;
      }


      /* 새 사진을 불러오면 버튼을 원래 상태로 */
      clearTimeout(buttonTimer);

      saveBtn.textContent =
        "저장하기";

      saveBtn.classList.remove(
        "saved"
      );

      message.style.display =
        "none";


      if (objectUrl) {
        URL.revokeObjectURL(
          objectUrl
        );
      }


      objectUrl =
        URL.createObjectURL(file);


      preview.onload = () => {

        originalWidth =
          preview.naturalWidth;

        originalHeight =
          preview.naturalHeight;


        selectedY =
          Math.min(
            DEFAULT_CUT,
            originalHeight
          );


        empty.hidden = true;

        preview.hidden = false;

        cropLine.hidden = false;

        saveBtn.disabled = false;


        sizeInfo.textContent =
          "원본 " +
          originalWidth.toLocaleString() +
          " × " +
          originalHeight.toLocaleString() +
          " px";


        requestAnimationFrame(() => {

          requestAnimationFrame(() => {

            updateLine();

            viewport.scrollTo({
              top: 0,
              left: 0,
              behavior: "auto"
            });

          });

        });

      };


      preview.onerror = () => {

        alert(
          "사진을 불러오지 못했습니다."
        );

      };


      preview.src =
        objectUrl;
    }
  );


  window.addEventListener(
    "resize",
    () => {

      requestAnimationFrame(
        updateLine
      );

    }
  );


  function createCanvas() {

    if (
      !originalWidth ||
      !originalHeight ||
      !objectUrl
    ) {
      return null;
    }


    const cropHeight =
      clampY(selectedY);


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      originalWidth;

    canvas.height =
      cropHeight;


    const ctx =
      canvas.getContext(
        "2d",
        { alpha: false }
      );


    if (!ctx) {
      return null;
    }


    ctx.drawImage(
      preview,

      0,
      0,
      originalWidth,
      cropHeight,

      0,
      0,
      originalWidth,
      cropHeight
    );


    return canvas;
  }


  saveBtn.addEventListener(
    "click",
    () => {

      try {

        const canvas =
          createCanvas();


        if (!canvas) {

          alert(
            "이미지를 만들지 못했습니다."
          );

          return;
        }


        const dataUrl =
          canvas.toDataURL(
            "image/jpeg",
            0.95
          );


        const link =
          document.createElement(
            "a"
          );


        link.href =
          dataUrl;


        link.download =
          "cropped-" +
          Date.now() +
          ".jpg";


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();


        /* 저장 완료 표시 */
        showSaveSuccess();


      } catch (error) {

        console.error(error);

        alert(
          "저장 중 오류가 발생했습니다."
        );

      }

    }
  );


  /*
    예전에 등록된 서비스워커 제거
  */

  if (
    "serviceWorker" in navigator
  ) {

    navigator.serviceWorker
      .getRegistrations()
      .then(
        registrations => {

          registrations.forEach(
            registration => {
              registration.unregister();
            }
          );

        }
      )
      .catch(() => {});
  }


  /*
    예전에 저장된 캐시 제거
  */

  if ("caches" in window) {

    caches.keys()
      .then(
        keys => {

          keys.forEach(
            key => {
              caches.delete(key);
            }
          );

        }
      )
      .catch(() => {});
  }

})();
</script>

</body>
</html>
