<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>긴사진 자르기</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f4f6;
  color: #111827;
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  background: white;
}

header {
  padding: 14px 16px 12px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
}

h1 {
  margin: 0;
  font-size: 20px;
}

.sub {
  margin-top: 4px;
  font-size: 12px;
  color: #6b7280;
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 14px 16px 10px;
}

button,
.fileLabel {
  min-height: 48px;
  border: 0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.fileLabel {
  background: #111827;
  color: white;
}

#saveBtn {
  background: #ef4444;
  color: white;
}

#shareBtn {
  background: #2563eb;
  color: white;
}

button:disabled {
  opacity: .4;
}

input[type=file] {
  display: none;
}

.info {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 0 16px 10px;
  font-size: 13px;
  color: #4b5563;
}

.hint {
  margin: 0 16px 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #fff7ed;
  color: #9a3412;
  font-size: 13px;
}

.viewport {
  height: calc(100vh - 195px);
  min-height: 420px;
  overflow: auto;
  background: #d1d5db;
}

.stage {
  position: relative;
  width: 100%;
  min-height: 100%;
  background: white;
}

#preview {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  user-select: none;
  -webkit-user-drag: none;
}

.empty {
  min-height: 420px;
  display: grid;
  place-items: center;
  padding: 25px;
  text-align: center;
  color: #6b7280;
}

[hidden] {
  display: none !important;
}

.cropLine {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 3px solid #ef4444;
  z-index: 10;
  cursor: ns-resize;
  touch-action: none;
}

.cropLine::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -20px;
  height: 40px;
}

.badge {
  position: absolute;
  right: 8px;
  top: -34px;
  padding: 5px 8px;
  border-radius: 8px;
  background: #ef4444;
  color: white;
  font-size: 12px;
  font-weight: 800;
}

.message {
  display: none;
  margin: 0 16px 10px;
  padding: 9px 12px;
  border-radius: 8px;
  background: #ecfdf5;
  color: #166534;
  font-size: 13px;
}

@media (max-width: 520px) {
  .toolbar {
    grid-template-columns: 1fr 1fr;
  }

  .fileLabel {
    grid-column: 1 / 3;
  }
}
</style>
</head>

<body>

<main class="app">

<header>
  <h1>긴사진 자르기</h1>
  <div class="sub">
    사진은 서버로 전송되지 않고 이 기기 안에서만 처리됩니다.
  </div>
</header>

<section class="toolbar">

  <label class="fileLabel" for="fileInput">
    사진 불러오기
  </label>

  <button id="saveBtn" disabled>
    저장하기
  </button>

  <button id="shareBtn" disabled>
    공유하기
  </button>

  <input
    id="fileInput"
    type="file"
    accept="image/*"
  >

</section>

<section class="info">
  <span id="sizeInfo">사진을 선택해 주세요</span>
  <strong id="cutInfo">끝점 416px</strong>
</section>

<div class="hint">
  빨간 선을 움직여 자를 위치를 정하세요.
  처음 위치는 원본 기준 416px입니다.
</div>

<div class="message" id="message"></div>

<section class="viewport" id="viewport">

  <div class="stage">

    <div class="empty" id="empty">
      긴 스크린샷이나 사진을 선택하면 여기에 표시됩니다.
    </div>

    <img id="preview" hidden>

    <div class="cropLine" id="cropLine" hidden>
      <span class="badge" id="lineBadge">416px</span>
    </div>

  </div>

</section>

</main>

<script>
(() => {

  const DEFAULT_CUT = 416;

  const fileInput =
    document.getElementById("fileInput");

  const saveBtn =
    document.getElementById("saveBtn");

  const shareBtn =
    document.getElementById("shareBtn");

  const preview =
    document.getElementById("preview");

  const cropLine =
    document.getElementById("cropLine");

  const lineBadge =
    document.getElementById("lineBadge");

  const sizeInfo =
    document.getElementById("sizeInfo");

  const cutInfo =
    document.getElementById("cutInfo");

  const viewport =
    document.getElementById("viewport");

  const empty =
    document.getElementById("empty");

  const message =
    document.getElementById("message");


  let objectUrl = null;

  let originalWidth = 0;

  let originalHeight = 0;

  let selectedY = DEFAULT_CUT;

  let dragging = false;


  function showMessage(text) {

    message.textContent = text;

    message.style.display = "block";

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(() => {

      message.style.display = "none";

    }, 3000);

  }


  function scale() {

    if (!originalWidth) return 1;

    return preview.clientWidth / originalWidth;

  }


  function clampY(y) {

    return Math.max(
      1,
      Math.min(
        originalHeight,
        Math.round(y)
      )
    );

  }


  function updateLine() {

    if (!originalHeight) return;

    selectedY = clampY(selectedY);

    cropLine.style.top =
      (selectedY * scale()) + "px";

    lineBadge.textContent =
      selectedY.toLocaleString() + "px";

    cutInfo.textContent =
      "끝점 " +
      selectedY.toLocaleString() +
      "px";

  }


  function moveLine(clientY) {

    const rect =
      preview.getBoundingClientRect();

    const y =
      (clientY - rect.top) / scale();

    selectedY = clampY(y);

    updateLine();

  }


  cropLine.addEventListener(
    "pointerdown",
    event => {

      dragging = true;

      cropLine.setPointerCapture(
        event.pointerId
      );

      event.preventDefault();

    }
  );


  cropLine.addEventListener(
    "pointermove",
    event => {

      if (!dragging) return;

      moveLine(event.clientY);

      event.preventDefault();

    }
  );


  cropLine.addEventListener(
    "pointerup",
    event => {

      dragging = false;

      try {

        cropLine.releasePointerCapture(
          event.pointerId
        );

      } catch (_) {}

    }
  );


  cropLine.addEventListener(
    "pointercancel",
    () => {

      dragging = false;

    }
  );


  fileInput.addEventListener(
    "change",
    () => {

      const file =
        fileInput.files?.[0];

      if (!file) return;


      if (objectUrl) {

        URL.revokeObjectURL(
          objectUrl
        );

      }


      objectUrl =
        URL.createObjectURL(file);


      preview.onload = () => {

        originalWidth =
          preview.naturalWidth;

        originalHeight =
          preview.naturalHeight;


        selectedY =
          Math.min(
            DEFAULT_CUT,
            originalHeight
          );


        empty.hidden = true;

        preview.hidden = false;

        cropLine.hidden = false;

        saveBtn.disabled = false;

        shareBtn.disabled = false;


        sizeInfo.textContent =
          "원본 " +
          originalWidth.toLocaleString() +
          " × " +
          originalHeight.toLocaleString() +
          " px";


        requestAnimationFrame(() => {

          updateLine();

          viewport.scrollTo(
            0,
            0
          );

        });

      };


      preview.onerror = () => {

        alert(
          "사진을 불러오지 못했습니다."
        );

      };


      preview.src =
        objectUrl;

    }
  );


  window.addEventListener(
    "resize",
    updateLine
  );


  function createCanvas() {

    if (
      !originalWidth ||
      !originalHeight
    ) {

      return null;

    }


    const cropHeight =
      clampY(selectedY);


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      originalWidth;

    canvas.height =
      cropHeight;


    const ctx =
      canvas.getContext(
        "2d",
        { alpha: false }
      );


    if (!ctx) {
      return null;
    }


    ctx.drawImage(
      preview,

      0,
      0,
      originalWidth,
      cropHeight,

      0,
      0,
      originalWidth,
      cropHeight
    );


    return canvas;

  }


  function dataUrlToBlob(dataUrl) {

    const parts =
      dataUrl.split(",");

    const byteString =
      atob(parts[1]);

    const bytes =
      new Uint8Array(
        byteString.length
      );


    for (
      let i = 0;
      i < byteString.length;
      i++
    ) {

      bytes[i] =
        byteString.charCodeAt(i);

    }


    return new Blob(
      [bytes],
      { type: "image/jpeg" }
    );

  }


  saveBtn.addEventListener(
    "click",
    () => {

      try {

        const canvas =
          createCanvas();

        if (!canvas) {

          alert(
            "이미지를 만들지 못했습니다."
          );

          return;

        }


        /*
          중요:
          toBlob을 기다리지 않고
          버튼 클릭 중에 바로 파일을 만듭니다.
        */

        const dataUrl =
          canvas.toDataURL(
            "image/jpeg",
            0.95
          );


        const link =
          document.createElement(
            "a"
          );


        link.href =
          dataUrl;

        link.download =
          "cropped-" +
          Date.now() +
          ".jpg";


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();


        showMessage(
          "저장했습니다."
        );


      } catch (error) {

        console.error(error);

        alert(
          "저장 중 오류가 발생했습니다."
        );

      }

    }
  );


  shareBtn.addEventListener(
    "click",
    async () => {

      try {

        const canvas =
          createCanvas();

        if (!canvas) {

          alert(
            "이미지를 만들지 못했습니다."
          );

          return;

        }


        /*
          공유 버튼을 누른 순간
          동기 방식으로 파일을 만듭니다.
        */

        const dataUrl =
          canvas.toDataURL(
            "image/jpeg",
            0.95
          );


        const blob =
          dataUrlToBlob(
            dataUrl
          );


        const file =
          new File(
            [blob],
            "cropped-" +
            Date.now() +
            ".jpg",
            {
              type: "image/jpeg"
            }
          );


        if (
          !navigator.share ||
          !navigator.canShare ||
          !navigator.canShare({
            files: [file]
          })
        ) {

          alert(
            "이 기기에서는 직접 공유 기능을 지원하지 않습니다."
          );

          return;

        }


        await navigator.share({
          files: [file],
          title: "자른 이미지"
        });


      } catch (error) {

        if (
          error?.name ===
          "AbortError"
        ) {

          return;

        }


        console.error(error);

        alert(
          "공유 중 오류가 발생했습니다."
        );

      }

    }
  );


  /*
    예전 서비스워커 제거
  */

  if (
    "serviceWorker" in navigator
  ) {

    navigator.serviceWorker
      .getRegistrations()
      .then(
        registrations => {

          registrations.forEach(
            registration =>
              registration.unregister()
          );

        }
      )
      .catch(() => {});

  }


  /*
    예전 캐시 제거
  */

  if ("caches" in window) {

    caches.keys()
      .then(
        keys => {

          keys.forEach(
            key =>
              caches.delete(key)
          );

        }
      )
      .catch(() => {});

  }


})();
</script>

</body>
</html>
